<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tavern — Dev UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --deep-oak: #1a1410;
    --aged-leather: #241e17;
    --worn-surface: #2c2419;
    --smoke-border: #3d3428;
    --parchment-text: #e8dcc8;
    --faded-ink: #9b8e7a;
    --hearth-amber: #c9944a;
    --ember-red: #c45a4a;
    --sage-green: #5a7a5e;
    --dm-shadow: #1e1912;
    --player-shadow: #1a2218;
    --trace-violet: #2a2435;
    --trace-text: #a89cbd;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-weight: 400;
    background: var(--deep-oak);
    color: var(--parchment-text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Header ──────────────────────────────────────────── */
  header {
    background: var(--aged-leather);
    border-bottom: 1px solid var(--smoke-border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Crimson Pro', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--hearth-amber);
    letter-spacing: 0.01em;
  }

  .session-stats {
    font-size: 11px;
    font-weight: 400;
    color: var(--faded-ink);
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    border-left: 1px solid var(--smoke-border);
    padding-left: 16px;
  }

  header .status {
    margin-left: auto;
    margin-right: 40px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--faded-ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  header .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ember-red); transition: background 0.3s;
  }
  header .status .dot.connected { background: var(--sage-green); }

  /* ── Main Area (chat + side panel) ────────────────────── */
  #main-area {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  #chat-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* ── Messages ────────────────────────────────────────── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }

  /* ── Side Panel ─────────────────────────────────────── */
  #side-panel {
    width: 320px;
    flex-shrink: 0;
    background: var(--aged-leather);
    border-left: 1px solid var(--smoke-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.2s;
  }

  #side-panel.collapsed {
    width: 0;
    opacity: 0;
    border-left: none;
  }

  #panel-tabs {
    display: flex;
    border-bottom: 1px solid var(--smoke-border);
    flex-shrink: 0;
  }

  .panel-tab {
    flex: 1;
    background: none;
    border: none;
    color: var(--faded-ink);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.03em;
    padding: 12px 8px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
    text-transform: uppercase;
  }

  .panel-tab:hover { color: var(--parchment-text); }
  .panel-tab.active {
    color: var(--hearth-amber);
    background: rgba(201, 148, 74, 0.06);
  }

  #panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--parchment-text);
  }

  #panel-content p { margin: 0 0 0.4em 0; }
  #panel-content p:last-child { margin-bottom: 0; }
  #panel-content strong {
    color: var(--hearth-amber);
    font-family: 'Crimson Pro', serif;
    font-weight: 600;
  }
  #panel-content em { color: #d4cabb; font-style: italic; }
  #panel-content ul, #panel-content ol { padding-left: 1.2em; margin: 4px 0; }
  #panel-content li { margin: 2px 0; }
  #panel-content hr { border: none; border-top: 1px solid var(--smoke-border); margin: 10px 0; }
  #panel-content h1, #panel-content h2, #panel-content h3 {
    font-family: 'Crimson Pro', serif;
    font-weight: 600;
    color: var(--hearth-amber);
    margin: 10px 0 4px 0;
  }
  #panel-content h1 { font-size: 16px; }
  #panel-content h2 { font-size: 14px; }
  #panel-content h3 { font-size: 13px; }

  .panel-empty {
    color: var(--faded-ink);
    text-align: center;
    padding: 40px 20px;
    font-style: italic;
  }

  /* ── Panel Toggle Button ───────────────────────────── */
  #panel-toggle {
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 10;
    width: 32px; height: 32px;
    background: var(--worn-surface);
    border: 1px solid var(--smoke-border);
    border-radius: 6px;
    color: var(--faded-ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, background 0.15s;
  }
  #panel-toggle:hover { color: var(--hearth-amber); background: var(--smoke-border); }
  #panel-toggle.active { color: var(--hearth-amber); }

  .msg {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 14px;
    word-wrap: break-word;
    animation: fadeIn 0.2s ease;
  }

  .msg p { margin: 0 0 0.5em 0; max-width: 65ch; }
  .msg p:last-child { margin-bottom: 0; }

  .msg strong {
    color: var(--hearth-amber);
    font-family: 'Crimson Pro', serif;
    font-weight: 600;
  }
  .msg em { font-style: italic; color: #d4cabb; }

  .msg blockquote {
    background: rgba(155, 142, 122, 0.08);
    padding: 8px 14px;
    border-radius: 6px;
    margin: 6px 0;
    color: var(--faded-ink);
    font-style: italic;
  }

  .msg ul, .msg ol { padding-left: 1.3em; margin: 4px 0; }
  .msg li { margin: 2px 0; }

  .msg h1, .msg h2, .msg h3 {
    font-family: 'Crimson Pro', serif;
    font-weight: 600;
    color: var(--hearth-amber);
    margin: 8px 0 4px 0;
  }
  .msg h1 { font-size: 18px; }
  .msg h2 { font-size: 16px; }
  .msg h3 { font-size: 14px; }

  .msg hr { border: none; border-top: 1px solid var(--smoke-border); margin: 8px 0; }

  .msg code {
    background: var(--aged-leather);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    font-size: 12px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.dm {
    align-self: flex-start;
    background: var(--dm-shadow);
    border-bottom-left-radius: 4px;
  }

  .msg.player {
    align-self: flex-end;
    background: var(--player-shadow);
    border-bottom-right-radius: 4px;
  }

  .msg.error {
    align-self: flex-start;
    background: #2d1c18;
    border: 1px solid var(--ember-red);
    color: #e8a298;
    border-bottom-left-radius: 4px;
  }

  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--faded-ink);
    font-size: 13px;
    text-align: center;
    padding: 4px 12px;
    max-width: 100%;
  }

  /* ── Inline Trace Bubble ────────────────────────────── */
  .msg.trace {
    align-self: flex-start;
    background: var(--trace-violet);
    border: 1px solid rgba(168, 156, 189, 0.12);
    color: var(--trace-text);
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    font-size: 11px;
    line-height: 1.5;
    padding: 8px 12px;
    max-width: 90%;
    border-bottom-left-radius: 4px;
  }

  /* ── Inline Keyboard (Fork Buttons) ─────────────────── */
  .keyboard {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
    max-width: 80%;
    align-self: flex-start;
    animation: fadeIn 0.2s ease;
  }

  .keyboard button {
    background: var(--worn-surface);
    color: var(--hearth-amber);
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
    font-family: 'Inter', inherit;
    text-align: left;
    width: 100%;
  }

  .keyboard button:hover {
    background: var(--smoke-border);
  }

  .keyboard button:active { transform: scale(0.98); }

  .keyboard button.other {
    color: var(--faded-ink);
    border: 1px dashed var(--smoke-border);
    background: transparent;
  }
  .keyboard button.other:hover {
    background: var(--worn-surface);
  }

  /* ── Typing Indicator ───────────────────────────────── */
  .typing {
    align-self: flex-start;
    display: none;
    gap: 4px;
    padding: 12px 18px;
    background: var(--dm-shadow);
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
    margin: 0 20px;
  }

  .typing.active { display: flex; }

  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--hearth-amber);
    animation: bounce 1.4s ease-in-out infinite;
  }
  .typing span:nth-child(1) { opacity: 0.5; }
  .typing span:nth-child(2) { animation-delay: 0.2s; opacity: 0.7; }
  .typing span:nth-child(3) { animation-delay: 0.4s; opacity: 0.9; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: var(--dot-opacity, 0.4); }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── Input Bar ──────────────────────────────────────── */
  #input-bar {
    background: var(--aged-leather);
    border-top: 1px solid var(--smoke-border);
    padding: 12px 16px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }

  #input-bar textarea {
    width: 100%;
    background: var(--aged-leather);
    border: 1px solid var(--smoke-border);
    border-radius: 16px;
    color: var(--parchment-text);
    font-size: 14px;
    font-family: 'Inter', inherit;
    padding: 10px 16px;
    resize: none;
    max-height: 120px;
    line-height: 1.4;
    outline: none;
    transition: border-color 0.2s;
  }

  #input-bar textarea:focus { border-color: rgba(201, 148, 74, 0.5); }
  #input-bar textarea::placeholder { color: var(--faded-ink); }

  #input-bar button {
    width: 40px; height: 40px; border-radius: 50%;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background 0.15s;
  }

  #send-btn { background: var(--hearth-amber); color: var(--deep-oak); }
  #send-btn:hover { filter: brightness(1.1); }
  #send-btn:disabled { opacity: 0.3; cursor: default; }

  #voice-btn {
    background: var(--worn-surface);
    border: 1px solid var(--smoke-border) !important;
    color: var(--faded-ink);
  }
  #voice-btn:hover { background: var(--smoke-border); }
  #voice-btn.recording { background: rgba(196, 90, 74, 0.2); color: var(--ember-red); border-color: var(--ember-red) !important; }

  /* ── Command Autocomplete ───────────────────────────── */
  #autocomplete {
    position: absolute; bottom: 100%; left: 16px; right: 16px;
    background: var(--worn-surface); border: 1px solid var(--smoke-border);
    border-radius: 8px; display: none; overflow: hidden; margin-bottom: 4px;
  }
  #autocomplete.open { display: block; }
  #autocomplete .item { padding: 8px 14px; cursor: pointer; font-size: 13px; display: flex; gap: 8px; }
  #autocomplete .item:hover, #autocomplete .item.selected { background: var(--smoke-border); }
  #autocomplete .item .cmd { color: var(--hearth-amber); font-weight: 600; }
  #autocomplete .item .desc { color: var(--faded-ink); }
  #input-wrapper { position: relative; flex: 1; }

  /* ── Scrollbar ──────────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--smoke-border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--faded-ink); }
</style>
</head>
<body>

<header>
  <h1>Tavern</h1>
  <span class="session-stats" id="session-stats"></span>
  <div class="status">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Connecting...</span>
  </div>
</header>

<div id="main-area">
  <div id="chat-col">
    <div id="messages">
      <div class="msg system">Type /new to start a campaign, or /help for commands.</div>
    </div>

    <div class="typing" id="typing">
      <span></span><span></span><span></span>
    </div>
  </div>

  <aside id="side-panel" class="collapsed">
    <div id="panel-tabs">
      <button class="panel-tab active" data-panel="sheet">Sheet</button>
      <button class="panel-tab" data-panel="inventory">Inventory</button>
      <button class="panel-tab" data-panel="world">World</button>
    </div>
    <div id="panel-content"></div>
  </aside>
</div>

<button id="panel-toggle" title="Toggle side panel">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="18" height="18" rx="2"/>
    <line x1="15" y1="3" x2="15" y2="21"/>
  </svg>
</button>

<div id="input-bar">
  <button id="voice-btn" title="Hold to record voice">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
    </svg>
  </button>
  <div id="input-wrapper">
    <div id="autocomplete"></div>
    <textarea id="input" rows="1" placeholder="Type a message or /command..." autofocus></textarea>
  </div>
  <button id="send-btn" disabled title="Send">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
    </svg>
  </button>
</div>

<script>
const COMMANDS = [
  { cmd: "/new", desc: "Start a new campaign" },
  { cmd: "/help", desc: "Show available commands" },
  { cmd: "/sheet", desc: "View character sheet" },
  { cmd: "/inventory", desc: "View inventory" },
  { cmd: "/abilities", desc: "View abilities" },
  { cmd: "/world", desc: "View world state" },
  { cmd: "/roll", desc: "Roll dice (e.g. /roll 2d6+3)" },
  { cmd: "/model", desc: "Change narrator model" },
  { cmd: "/rest", desc: "Short or long rest" },
  { cmd: "/undo", desc: "Undo last turn" },
  { cmd: "/reset", desc: "Clear message history" },
  { cmd: "/saves", desc: "List/switch campaigns" },
  { cmd: "/concise", desc: "Concise narration mode" },
  { cmd: "/verbose", desc: "Verbose narration mode" },
  { cmd: "/traces", desc: "Toggle trace display" },
];

// ── Markdown renderer ─────────────────────────────────
function renderMd(text) {
  if (!text) return "";
  // Escape HTML
  let html = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  // Split into lines for block-level processing
  const lines = html.split("\n");
  const out = [];
  let inList = false;
  let inBlockquote = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];

    // Blockquotes
    if (line.match(/^&gt;\s?/)) {
      const content = line.replace(/^&gt;\s?/, "");
      if (!inBlockquote) { out.push("<blockquote>"); inBlockquote = true; }
      out.push(inlineMarkdown(content));
      if (i + 1 >= lines.length || !lines[i + 1].match(/^&gt;\s?/)) {
        out.push("</blockquote>");
        inBlockquote = false;
      }
      continue;
    }

    // Headings
    const h3 = line.match(/^###\s+(.+)/);
    if (h3) { closeList(); out.push("<h3>" + inlineMarkdown(h3[1]) + "</h3>"); continue; }
    const h2 = line.match(/^##\s+(.+)/);
    if (h2) { closeList(); out.push("<h2>" + inlineMarkdown(h2[1]) + "</h2>"); continue; }
    const h1 = line.match(/^#\s+(.+)/);
    if (h1) { closeList(); out.push("<h1>" + inlineMarkdown(h1[1]) + "</h1>"); continue; }

    // Horizontal rule
    if (line.match(/^---+$/)) { closeList(); out.push("<hr>"); continue; }

    // Unordered list
    if (line.match(/^[-*]\s+/)) {
      if (!inList) { out.push("<ul>"); inList = true; }
      out.push("<li>" + inlineMarkdown(line.replace(/^[-*]\s+/, "")) + "</li>");
      continue;
    }

    // Ordered list
    const ol = line.match(/^(\d+)\.\s+(.+)/);
    if (ol) {
      if (!inList) { out.push("<ol>"); inList = true; }
      out.push("<li>" + inlineMarkdown(ol[2]) + "</li>");
      continue;
    }

    // Close list if we hit a non-list line
    closeList();

    // Empty line = paragraph break
    if (line.trim() === "") {
      continue;
    }

    // Regular paragraph
    out.push("<p>" + inlineMarkdown(line) + "</p>");
  }
  closeList();

  function closeList() {
    if (inList) {
      // Detect if it was ordered or unordered by checking last open tag
      const lastOpen = out.findLast(l => l === "<ul>" || l === "<ol>");
      out.push(lastOpen === "<ol>" ? "</ol>" : "</ul>");
      inList = false;
    }
  }

  return out.join("\n");
}

function inlineMarkdown(text) {
  return text
    // Bold + italic
    .replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>")
    // Bold
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    // Italic
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/_(.+?)_/g, "<em>$1</em>")
    // Inline code
    .replace(/`(.+?)`/g, "<code>$1</code>");
}

// ── DOM refs ───────────────────────────────────────────
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const voiceBtn = document.getElementById("voice-btn");
const typingEl = document.getElementById("typing");
const statusDot = document.getElementById("status-dot");
const statusText = document.getElementById("status-text");
const autocompleteEl = document.getElementById("autocomplete");
const sessionStatsEl = document.getElementById("session-stats");

let ws = null;
let mediaRecorder = null;
let audioChunks = [];
let acIndex = -1;
let streamingBubble = null;
let streamingRawText = "";
let pendingTraceLines = [];

// ── WebSocket ──────────────────────────────────────────
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    statusDot.classList.add("connected");
    statusText.textContent = "Connected";
  };

  ws.onclose = () => {
    statusDot.classList.remove("connected");
    statusText.textContent = "Disconnected — reconnecting...";
    setTimeout(connect, 2000);
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case "narrative": addDmMessage(msg.text, msg.forks); break;
      case "error": addErrorMessage(msg.text); break;
      case "forks": addKeyboard(msg.forks); break;
      case "trace": addTraceBubble(msg.text); break;
      case "trace_line":
        pendingTraceLines.push(msg.text);
        updateLiveTrace();
        break;
      case "stream_start":
        typingEl.classList.remove("active");
        pendingTraceLines = [];
        streamingRawText = "";
        streamingBubble = document.createElement("div");
        streamingBubble.className = "msg dm";
        streamingBubble.textContent = "";
        messagesEl.appendChild(streamingBubble);
        scrollToBottom();
        break;
      case "stream_delta":
        if (streamingBubble) {
          streamingRawText += msg.text;
          streamingBubble.textContent = streamingRawText;
          scrollToBottom();
        }
        break;
      case "stream_end":
        typingEl.classList.remove("active");
        if (streamingBubble) {
          const finalText = msg.text || streamingRawText;
          if (finalText.trim()) {
            streamingBubble.innerHTML = renderMd(finalText);
          } else {
            streamingBubble.remove();
          }
          streamingBubble = null;
          streamingRawText = "";
        }
        if (msg.forks && msg.forks.length > 0) addKeyboard(msg.forks);
        break;
      case "session_stats":
        sessionStatsEl.textContent = `${msg.turns} turn${msg.turns !== 1 ? "s" : ""} · $${msg.cost.toFixed(4)}`;
        break;
      case "typing":
        if (msg.active) {
          typingEl.classList.add("active");
          scrollToBottom();
        } else {
          typingEl.classList.remove("active");
        }
        break;
      case "panel_data":
        updatePanelData(msg.panels);
        break;
      case "chat_history":
        loadChatHistory(msg.messages);
        break;
    }
  };
}

// ── Messages ───────────────────────────────────────────
function loadChatHistory(messages) {
  // Clear existing messages except the system welcome
  const children = Array.from(messagesEl.children);
  children.forEach(child => {
    if (!child.classList.contains("system")) child.remove();
  });
  // Also remove any leftover keyboards
  messagesEl.querySelectorAll(".keyboard").forEach(kb => kb.remove());

  if (messages.length === 0) return;

  // Remove the system welcome message since we have history
  const welcome = messagesEl.querySelector(".msg.system");
  if (welcome) welcome.remove();

  for (const msg of messages) {
    const el = document.createElement("div");
    el.className = msg.role === "user" ? "msg player" : "msg dm";
    if (msg.role === "user") {
      el.textContent = msg.content;
    } else {
      el.innerHTML = renderMd(msg.content);
    }
    messagesEl.appendChild(el);
  }
  scrollToBottom();
}

function addDmMessage(text, forks) {
  typingEl.classList.remove("active");
  const el = document.createElement("div");
  el.className = "msg dm";
  el.innerHTML = renderMd(text);
  messagesEl.appendChild(el);
  if (forks && forks.length > 0) addKeyboard(forks);
  scrollToBottom();
}

function addPlayerMessage(text) {
  const el = document.createElement("div");
  el.className = "msg player";
  el.textContent = text;
  messagesEl.appendChild(el);
  scrollToBottom();
}

function addErrorMessage(text) {
  typingEl.classList.remove("active");
  const el = document.createElement("div");
  el.className = "msg error";
  el.innerHTML = renderMd(text);
  messagesEl.appendChild(el);
  scrollToBottom();
}

function addTraceBubble(text) {
  const el = document.createElement("div");
  el.className = "msg trace";
  el.textContent = text;
  // Insert before the streaming bubble or last DM message
  const target = streamingBubble || messagesEl.lastElementChild;
  if (target && target !== messagesEl.firstElementChild) {
    messagesEl.insertBefore(el, target);
  } else {
    messagesEl.appendChild(el);
  }
  scrollToBottom();
}

function updateLiveTrace() {
  let live = messagesEl.querySelector(".msg.trace.live");
  if (!live) {
    live = document.createElement("div");
    live.className = "msg trace live";
    const target = streamingBubble || null;
    if (target) {
      messagesEl.insertBefore(live, target);
    } else {
      messagesEl.appendChild(live);
    }
  }
  live.textContent = pendingTraceLines.join("\n");
  scrollToBottom();
}

function addKeyboard(forks) {
  const prev = messagesEl.querySelector(".keyboard:last-child");
  if (prev) prev.remove();

  const kb = document.createElement("div");
  kb.className = "keyboard";

  for (const fork of forks) {
    const btn = document.createElement("button");
    btn.textContent = fork.label;
    btn.title = fork.detail;
    btn.onclick = () => {
      addPlayerMessage(fork.label);
      kb.remove();
      ws.send(JSON.stringify({ type: "message", text: fork.label }));
    };
    kb.appendChild(btn);
  }

  const other = document.createElement("button");
  other.textContent = "Other...";
  other.className = "other";
  other.onclick = () => {
    kb.remove();
    inputEl.focus();
    inputEl.placeholder = "Type your action...";
  };
  kb.appendChild(other);

  messagesEl.appendChild(kb);
  scrollToBottom();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

// ── Send ───────────────────────────────────────────────
function send() {
  const text = inputEl.value.trim();
  if (!text || !ws || ws.readyState !== 1) return;

  const kb = messagesEl.querySelector(".keyboard:last-child");
  if (kb) kb.remove();

  addPlayerMessage(text);
  ws.send(JSON.stringify({ type: "message", text }));
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendBtn.disabled = true;
  closeAutocomplete();
}

// ── Input handling ─────────────────────────────────────
inputEl.addEventListener("input", () => {
  sendBtn.disabled = !inputEl.value.trim();
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  handleAutocomplete();
});

inputEl.addEventListener("keydown", (e) => {
  if (autocompleteEl.classList.contains("open")) {
    const items = autocompleteEl.querySelectorAll(".item");
    if (e.key === "ArrowDown") {
      e.preventDefault();
      acIndex = Math.min(acIndex + 1, items.length - 1);
      updateAcSelection(items);
      return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      acIndex = Math.max(acIndex - 1, 0);
      updateAcSelection(items);
      return;
    }
    if (e.key === "Tab" || (e.key === "Enter" && acIndex >= 0)) {
      e.preventDefault();
      if (acIndex >= 0 && items[acIndex]) {
        inputEl.value = items[acIndex].dataset.cmd + " ";
        closeAutocomplete();
        sendBtn.disabled = false;
      }
      return;
    }
    if (e.key === "Escape") { closeAutocomplete(); return; }
  }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

sendBtn.addEventListener("click", send);

// ── Autocomplete ───────────────────────────────────────
function handleAutocomplete() {
  const val = inputEl.value;
  if (!val.startsWith("/") || val.includes(" ")) { closeAutocomplete(); return; }

  const query = val.toLowerCase();
  const matches = COMMANDS.filter(c => c.cmd.startsWith(query));
  if (matches.length === 0 || (matches.length === 1 && matches[0].cmd === val)) {
    closeAutocomplete(); return;
  }

  acIndex = 0;
  autocompleteEl.innerHTML = matches.map((m, i) =>
    `<div class="item${i === 0 ? ' selected' : ''}" data-cmd="${m.cmd}">
      <span class="cmd">${m.cmd}</span>
      <span class="desc">${m.desc}</span>
    </div>`
  ).join("");

  autocompleteEl.querySelectorAll(".item").forEach(item => {
    item.addEventListener("click", () => {
      inputEl.value = item.dataset.cmd + " ";
      closeAutocomplete();
      inputEl.focus();
      sendBtn.disabled = false;
    });
  });
  autocompleteEl.classList.add("open");
}

function closeAutocomplete() { autocompleteEl.classList.remove("open"); acIndex = -1; }
function updateAcSelection(items) { items.forEach((el, i) => el.classList.toggle("selected", i === acIndex)); }

// ── Voice recording ────────────────────────────────────
let isRecording = false;

voiceBtn.addEventListener("mousedown", startRecording);
voiceBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startRecording(); });
voiceBtn.addEventListener("mouseup", stopRecording);
voiceBtn.addEventListener("mouseleave", stopRecording);
voiceBtn.addEventListener("touchend", stopRecording);

async function startRecording() {
  if (isRecording) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
      ? "audio/webm;codecs=opus" : "audio/webm";
    mediaRecorder = new MediaRecorder(stream, { mimeType });
    audioChunks = [];

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      if (audioChunks.length === 0) return;
      const blob = new Blob(audioChunks, { type: "audio/webm" });
      const buf = await blob.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      addPlayerMessage("🎤 [Voice memo]");
      ws.send(JSON.stringify({ type: "voice", audio: btoa(binary) }));
    };

    mediaRecorder.start();
    isRecording = true;
    voiceBtn.classList.add("recording");
  } catch (err) { console.error("Mic access denied:", err); }
}

function stopRecording() {
  if (!isRecording || !mediaRecorder) return;
  isRecording = false;
  voiceBtn.classList.remove("recording");
  mediaRecorder.stop();
}

// ── Side Panel ────────────────────────────────────────
const panelToggle = document.getElementById("panel-toggle");
const sidePanel = document.getElementById("side-panel");
const panelContent = document.getElementById("panel-content");
const panelTabs = document.querySelectorAll(".panel-tab");
let panelData = {};
let activePanel = "sheet";

panelToggle.addEventListener("click", () => {
  sidePanel.classList.toggle("collapsed");
  panelToggle.classList.toggle("active");
  if (!sidePanel.classList.contains("collapsed") && ws && ws.readyState === 1) {
    ws.send(JSON.stringify({ type: "panel_request" }));
  }
});

panelTabs.forEach(tab => {
  tab.addEventListener("click", () => {
    panelTabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activePanel = tab.dataset.panel;
    renderPanel();
  });
});

function updatePanelData(panels) {
  panelData = panels || {};
  renderPanel();
}

function renderPanel() {
  const content = panelData[activePanel];
  if (!content) {
    panelContent.innerHTML = '<div class="panel-empty">No data yet. Start a campaign with /new.</div>';
    return;
  }
  panelContent.innerHTML = renderMd(content);
}

// ── Boot ───────────────────────────────────────────────
connect();
</script>
